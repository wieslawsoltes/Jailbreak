name: Reconcile preserved desktop IDE work
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/reconcile-desktop-work.mjs
      - .github/workflows/reconcile-desktop-20260909.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: jailbreak-preserved-desktop-reconciliation
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile immutable source patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/reconcile-desktop-work.mjs
      - name: Verify compiler runtime examples and build
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results/desktop-reconciliation/unit.log
          npm run gate 2>&1 | tee test-results/desktop-reconciliation/gate.log
          npm run build 2>&1 | tee test-results/desktop-reconciliation/build.log
          npm run check 2>&1 | tee test-results/desktop-reconciliation/syntax.log
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compare converted binaries with independent CLR execution
        run: |
          node scripts/verify-msil-clr.mjs
          node scripts/verify-exceptions-clr.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser acceptance tooling
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Exercise the full real browser application suite
        run: |
          set -o pipefail
          python -m unittest discover -s tests/browser -p 'test_*.py' -v 2>&1 | tee test-results/desktop-reconciliation/browser.log
      - name: Preserve exactly the tested source
        run: |
          git archive --format=tar.gz HEAD > test-results/desktop-reconciliation/source.tar.gz
          git rev-parse HEAD > test-results/desktop-reconciliation/candidate.txt
          sha256sum test-results/desktop-reconciliation/source.tar.gz > test-results/desktop-reconciliation/source.sha256
      - name: Publish validated source without overwriting concurrent commits
        run: |
          git push origin HEAD:main
          git ls-remote origin refs/heads/main > test-results/desktop-reconciliation/published-ref.txt
      - name: Run canonical verification and Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run toolchain.yml --ref main
      - name: Retain reconciliation and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-reconciliation-evidence
          path: test-results
