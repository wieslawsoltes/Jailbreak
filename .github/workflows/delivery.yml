name: Source delivery and verification
on:
  push:
    branches: [main]
    paths: ['.delivery/**', '.github/workflows/delivery.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: jailbreak-delivery
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Archive transport integrity evidence
        uses: actions/upload-artifact@v4
        with:
          name: msil-delivery-evidence
          path: |
            .delivery/msil-*.b64
            .delivery/stage-20260908-msil-*.json
            .delivery/devtools-*.json
            .delivery/development.test.js
            .delivery/test_development.py
          include-hidden-files: true
      - name: Materialize verified source stages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .delivery/repair.py
          python3 .delivery/apply.py
          python3 .delivery/apply-devtools.py
      - name: Validate source before publishing commits
        run: |
          npm test
          npm run gate
          npm run build
          npm run check
      - name: Publish source commits
        run: git push origin HEAD:main
      - name: Verify browsers and deploy through the canonical pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run toolchain.yml --ref main
