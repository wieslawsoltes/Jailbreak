name: Native Windows PDB fixtures
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tests/fixtures/native-pdb-src/**', '.github/workflows/native-symbol-fixtures.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: native-symbol-fixture
  cancel-in-progress: false
jobs:
  fixture:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Compile owned source with the Windows Framework compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $output = Join-Path $env:RUNNER_TEMP 'native-symbols'
          $library = (Resolve-Path 'tests\fixtures\native-pdb-src\Library.cs').Path
          $oracle = (Resolve-Path 'tests\fixtures\native-pdb-src\Oracle.cs').Path
          New-Item -ItemType Directory -Force $output | Out-Null
          & $csc /nologo /target:library /debug:full /optimize- "/out:$output\Jailbreak.NativeSymbols.dll" $library
          if ($LASTEXITCODE) { throw 'Native-symbol DLL compilation failed' }
          & $csc /nologo /debug:full /optimize- "/reference:$output\Jailbreak.NativeSymbols.dll" "/out:$output\Oracle.exe" $oracle
          if ($LASTEXITCODE) { throw 'CLR oracle compilation failed' }
          & "$output\Oracle.exe" "$output\oracle.json"
          if ($LASTEXITCODE) { throw 'CLR native symbol oracle failed' }
          $pdb = [IO.File]::ReadAllBytes("$output\Jailbreak.NativeSymbols.pdb")
          if (![Text.Encoding]::ASCII.GetString($pdb, 0, 32).StartsWith('Microsoft C/C++ MSF 7.00')) { throw 'Fixture must be native MSF7, not Portable PDB' }
          $source = [IO.File]::ReadAllText($library)
          $files = @{}
          foreach ($name in @('Jailbreak.NativeSymbols.dll', 'Jailbreak.NativeSymbols.pdb')) {
            $bytes = [IO.File]::ReadAllBytes("$output\$name")
            $files[$name] = @{base64=[Convert]::ToBase64String($bytes);sha256=(Get-FileHash "$output\$name" -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          @{format='owned-native-symbol-fixture-v1';source=$source;files=$files;oracle=(Get-Content "$output\oracle.json" -Raw | ConvertFrom-Json);commit=(git rev-parse HEAD)} | ConvertTo-Json -Depth 12 -Compress | Set-Content "$output\native-pdb.json" -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: native-symbol-fixture
          path: ${{ runner.temp }}/native-symbols
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Retain fixture and validate available native-reader gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item "$env:RUNNER_TEMP\native-symbols\native-pdb.json" tests/fixtures/msil/native-pdb.json
          if (Test-Path tests/native-pdb.test.js) {
            node --test tests/native-pdb.test.js
            if ($LASTEXITCODE) { throw 'Native reader differs from independent CLR fixture' }
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/fixtures/msil/native-pdb.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'test(symbols): retain real Windows MSF7 DLL PDB source and CLR oracle'
            if ($LASTEXITCODE) { throw 'Fixture commit failed' }
            git push origin HEAD:main
            if ($LASTEXITCODE) { throw 'Concurrent source changed; fixture was not force-pushed' }
          }
      - name: Verify retained source with the canonical pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run toolchain.yml --ref main
