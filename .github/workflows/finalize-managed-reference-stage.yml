name: Finalize managed reference implementation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-managed-reference-stage.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: managed-reference-finalization
  cancel-in-progress: false
jobs:
  finalize:
    if: github.repository == 'wieslawsoltes/Jailbreak'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Recover immutable implementation without overwriting concurrent edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test-results/reference-finalization
          python - <<'PY'
          import base64, gzip, hashlib, io, json, os, pathlib, subprocess
          root=pathlib.Path.cwd()
          output=root/'test-results/reference-finalization'
          base='4ac5d173fb8bf34b611f668c3d90e071653547a2'
          blob='ae727e9401dfcbc9c82c84ed9fdb3315d3a8f97e'
          repo=os.environ['GITHUB_REPOSITORY']
          def git(*args,check=True):
              return subprocess.run(['git',*args],check=check,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          current=git('rev-parse','HEAD').stdout.decode().strip()
          git('merge-base','--is-ancestor',base,current)
          if git('status','--porcelain').stdout:
              raise RuntimeError('Checkout is not clean; no source may be replaced')
          response=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/blobs/{blob}']))
          raw=base64.b64decode(response['content'],validate=False)
          actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          if actual!=blob:
              raise RuntimeError('Preserved implementation Git blob identity differs')
          (output/'preserved-stage.gz').write_bytes(raw)
          with gzip.GzipFile(fileobj=io.BytesIO(raw)) as stream:
              data=stream.read(16*1024*1024+1)
          if len(data)>16*1024*1024:
              raise RuntimeError('Preserved source stage exceeds 16 MiB')
          (output/'preserved-stage-decoded.txt').write_bytes(data)
          text=data.decode('utf-8')
          prefix=('packages/','apps/','tests/','examples/','scripts/','docs/','integration/')
          def pathcheck(name):
              if not isinstance(name,str) or '\\' in name or '\0' in name or name.startswith('/'):
                  raise RuntimeError('Invalid preserved source path')
              parts=name.split('/')
              if any(p in ('','.','..','.git') for p in parts):
                  raise RuntimeError('Unsafe preserved source path')
              if not name.startswith(prefix) and name not in ('package.json','package-lock.json','.gitignore','README.md'):
                  raise RuntimeError('Preserved stage contains an unexpected path: '+name)
              path=root/name
              if any(p.is_symlink() for p in [path,*path.parents]):
                  raise RuntimeError('Source path crosses a symbolic link')
              return path
          updates=[]
          if text.startswith('diff --git ') or text.startswith('From '):
              patch=output/'implementation.patch'
              patch.write_bytes(data)
              stat=git('apply','--numstat','-z',str(patch)).stdout.split(b'\0')
              for entry in stat:
                  if entry:
                      pathcheck(entry.split(b'\t',2)[2].decode())
              git('apply','--3way','--index',str(patch))
          else:
              payload=json.loads(text)
              (output/'payload-shape.json').write_text(json.dumps({'kind':type(payload).__name__,'keys':list(payload)[:30] if isinstance(payload,dict) else None},indent=2))
              rows=payload.get('files',payload.get('changes',payload.get('records'))) if isinstance(payload,dict) else payload
              if rows is None and isinstance(payload,dict) and all('/' in p for p in payload):
                  rows=payload
              if isinstance(rows,dict):
                  rows=[{'path':p,'content':v} if isinstance(v,str) else {'path':p,**v} for p,v in rows.items()]
              if not isinstance(rows,list) or not rows or len(rows)>300:
                  raise RuntimeError('Unknown preserved source format; payload retained for inspection, no publication')
              seen=set()
              def digest(value): return hashlib.sha256(value).hexdigest()
              for row in rows:
                  if isinstance(row,list) and len(row)==3 and isinstance(row[1],str) and isinstance(row[2],dict):
                      name,change=row[1],row[2]
                  elif isinstance(row,dict) and isinstance(row.get('path'),str):
                      name,change=row['path'],row
                  else:
                      raise RuntimeError('Unknown source change record')
                  if name in seen: raise RuntimeError('Duplicate source update: '+name)
                  seen.add(name)
                  path=pathcheck(name)
                  present=path.read_bytes() if path.is_file() else None
                  before_result=git('show',base+':'+name,check=False)
                  original=before_result.stdout if before_result.returncode==0 else None
                  before=change.get('before')
                  after_hash=change.get('after')
                  if 'edits' in change:
                      if not isinstance(before,str) or not isinstance(after_hash,str):
                          raise RuntimeError('Delta must declare before/after SHA-256 hashes')
                      if present is not None and digest(present)==after_hash:
                          continue
                      starting=present if present is not None and digest(present)==before else original
                      if starting is None and before==digest(b''): starting=b''
                      if starting is None or digest(starting)!=before:
                          raise RuntimeError('Delta has no verified preimage: '+name)
                      # Saved edit offsets are JavaScript UTF-16 positions, not Python code points.
                      source=starting.decode('utf-8').encode('utf-16-le')
                      last=0;pieces=[]
                      for edit in change['edits']:
                          if not isinstance(edit,list) or len(edit)!=3:
                              raise RuntimeError('Invalid source delta')
                          start,end,replacement=edit
                          if type(start)!=int or type(end)!=int or start<last or end<start or end*2>len(source) or not isinstance(replacement,str):
                              raise RuntimeError('Overlapping or invalid UTF-16 source edits')
                          pieces.extend((source[last*2:start*2],replacement.encode('utf-16-le')));last=end
                      pieces.append(source[last*2:])
                      replacement=b''.join(pieces).decode('utf-16-le').encode('utf-8')
                      if digest(replacement)!=after_hash:
                          raise RuntimeError('Source result hash mismatch: '+name)
                      original=starting
                  else:
                      content=change.get('content')
                      if not isinstance(content,str):
                          raise RuntimeError('Source snapshots must contain explicit text')
                      replacement=content.encode('utf-8')
                      if change.get('encoding')=='base64': replacement=base64.b64decode(content,validate=True)
                      if present==replacement: continue
                      if isinstance(after_hash,str) and len(after_hash)==64 and digest(replacement)!=after_hash:
                          raise RuntimeError('Snapshot content hash mismatch')
                  if present!=original and not (present is None and original==b''):
                      if present is None or original is None:
                          raise RuntimeError('Concurrent file creation/deletion: '+name)
                      slots=[]
                      for label,value in [('current',present),('base',original),('next',replacement)]:
                          slot=output/(digest(name.encode())+'.'+label);slot.write_bytes(value);slots.append(str(slot))
                      merged=git('merge-file','-p',*slots,check=False)
                      if merged.returncode!=0:
                          raise RuntimeError('Three-way merge needs review: '+name)
                      replacement=merged.stdout
                  updates.append((path,replacement))
              # Only modify the checkout after validating every source preimage and merge.
              for path,value in updates:
                  path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(value)
              git('add','--all')
          (output/'recovery.json').write_text(json.dumps({'baseline':base,'checkout':current,'blob':blob,'payloadSha256':digest(data) if 'digest' in globals() else hashlib.sha256(data).hexdigest(),'updatedFiles':git('diff','--cached','--name-only').stdout.decode().splitlines()},indent=2)+'\n')
          print(git('diff','--cached','--stat').stdout.decode())
          PY
      - name: Add independent managed reference acceptance gate
        run: |
          cat > test-results/reference-finalization/write-acceptance.py <<'PY'
          from pathlib import Path
          import json
          root=Path.cwd()
          path=root/'scripts/verify-managed-references-clr.mjs'
          text='''/** Owned SDK fixtures only: independent CLR comparisons for compiled managed references. */
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {fileURLToPath} from 'node:url';
          import {buildReferenceFixture} from './build-reference-fixture.mjs';
          import {compileBinaryInputs} from '../packages/msil-compiler/debug.js';
          import {convertNugetPackages} from '../packages/nuget/index.js';
          import {createBinaryRuntime} from '../packages/msil-runtime/index.js';
          export async function verifyManagedReferenceFixture(fixture) {
            const bytes=name=>new Uint8Array(Buffer.from(fixture.files[name].base64,'base64'));
            const modes=[['release',{}],['source-debug',{debug:true}],['cooperative',{debug:true,cooperativeDebug:true}]];
            const results=[];
            for(const [mode,options] of modes) {
              for(const configuration of ['debug','release','package']) {
                const result=configuration==='package'
                  ? await convertNugetPackages([{path:'Jailbreak.ReferenceExamples.1.0.0.nupkg',bytes:bytes('packages/Jailbreak.ReferenceExamples.1.0.0.nupkg')}],{...options,targetFramework:'net8.0'})
                  : await compileBinaryInputs([
                      {path:'Jailbreak.ReferenceExamples.dll',bytes:bytes(configuration+'/Jailbreak.ReferenceExamples.dll')},
                      {path:'Jailbreak.ReferenceExamples.pdb',bytes:bytes(configuration+'/Jailbreak.ReferenceExamples.pdb')}
                    ],options);
                assert.equal(result.success,true,configuration+' '+mode+': '+JSON.stringify(result.diagnostics));
                const MS=createBinaryRuntime();
                new Function('MS',result.code)(MS);
                const type=MS.getType('Jailbreak.ReferenceExamples','ReferenceExamples.Calculations');
                const debuggerSession=options.cooperativeDebug?MS.createDebugger({}):null;
                let count=0;
                for(const [method,expected] of Object.entries(fixture.oracle)) {
                  const args=method==='Argument'?[12]:[];
                  const actual=debuggerSession?await debuggerSession.start(type,method,args).promise:type[method](...args);
                  assert.deepEqual(typeof actual==='bigint'?actual.toString():actual,expected,configuration+' '+mode+' '+method);
                  count++;
                }
                if(debuggerSession)assert.equal(debuggerSession.busy,false,'Debugger left a suspended invocation');
                results.push({configuration,mode,comparisons:count,passed:true});
              }
            }
            return results;
          }
          if(process.argv[1]&&path.resolve(process.argv[1])===fileURLToPath(import.meta.url)) {
            const {fixture,output}=await buildReferenceFixture();
            const results=await verifyManagedReferenceFixture(fixture);
            await fs.writeFile(path.join(output,'managed-reference-acceptance.json'),JSON.stringify({results},null,2)+'\\n');
            console.log(JSON.stringify(results));
          }
          '''
          if path.exists() and path.read_text()!=text:
              raise RuntimeError('An independent acceptance runner already exists; do not overwrite it')
          path.write_text(text)
          workflow=root/'.github/workflows/toolchain.yml'
          contents=workflow.read_text()
          command='node scripts/verify-managed-references-clr.mjs'
          if command not in contents:
              anchor='run: node scripts/verify-exceptions-clr.mjs'
              lines=contents.splitlines(keepends=True)
              matches=[i for i,line in enumerate(lines) if line.strip()==anchor]
              if len(matches)!=1:
                  raise RuntimeError('Canonical workflow layout changed; add the CLR gate explicitly after review')
              i=matches[0];indent=len(lines[i])-len(lines[i].lstrip())
              lines.insert(i+1,' '*(indent-2)+'- name: Verify managed ref-out semantics against fresh CLR execution\n'+' '*indent+'run: '+command+'\n')
              workflow.write_text(''.join(lines))
          PY
          python test-results/reference-finalization/write-acceptance.py
      - name: Verify actual compilers and independent CLR results
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results/reference-finalization/unit.log
          npm run gate 2>&1 | tee test-results/reference-finalization/examples.log
          npm run build 2>&1 | tee test-results/reference-finalization/build.log
          npm run check 2>&1 | tee test-results/reference-finalization/syntax.log
          node scripts/verify-msil-clr.mjs 2>&1 | tee test-results/reference-finalization/clr-baseline.log
          node scripts/verify-exceptions-clr.mjs 2>&1 | tee test-results/reference-finalization/clr-exceptions.log
          node scripts/verify-managed-references-clr.mjs 2>&1 | tee test-results/reference-finalization/clr-references.log
      - name: Install browser tooling
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify all existing browser workflows without weakening assertions
        run: |
          set -o pipefail
          python -m unittest discover -s tests/browser -p 'test_*.py' -v 2>&1 | tee test-results/reference-finalization/browser.log
      - name: Commit tested implementation and acceptance evidence definition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          report=json.loads(Path('test-results/reference-clr/managed-reference-acceptance.json').read_text())
          if len(report['results'])!=9 or not all(r['passed'] and r['comparisons']==14 for r in report['results']):
              raise RuntimeError('Independent managed-reference acceptance matrix did not pass')
          doc=Path('docs/milestone-managed-reference-acceptance.md')
          if not doc.exists():
              doc.write_text('''# Managed reference acceptance\n\nThe recovered managed-reference implementation is checked against a real .NET SDK fixture, not source substitutions or authored IL stand-ins. `scripts/verify-managed-references-clr.mjs` builds the owned Debug and Release libraries and package, independently executes the CLR oracle, then compiles and executes all 14 wrappers in release, source-debug and cooperative modes. Nine input/mode combinations must agree.\n\nThe cases cover local and aliased references, `out` initialization, object fields, static fields, array elements, strings, exact 64-bit values, floating point, narrowing, argument mutation, catch/finally cleanup, null receivers and array bounds. The gate is part of the canonical Toolchain verification workflow. Existing verifier, negative-input, source-symbol and browser tests remain mandatory.\n\nThis milestone does not establish arbitrary managed pointers, general value-type/generic semantics, SDK-generated async-state-machine compatibility, or complete ControlCatalog execution. Those remain separate mandatory targets.\n''')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'feat(msil): publish recovered managed references with independent Debug Release and NuGet CLR gates'
          fi
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
          git rev-parse HEAD > test-results/reference-finalization/published-sha.txt
          gh workflow run toolchain.yml --ref main
      - name: Retain source and verification results even if recovery needs review
        if: always()
        run: |
          git diff --binary HEAD > test-results/reference-finalization/uncommitted.patch
          git status --short > test-results/reference-finalization/working-tree.txt
          git archive --format=tar.gz HEAD > test-results/reference-finalization/source-head.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-reference-finalization-evidence
          path: |
            test-results/reference-finalization
            test-results/reference-clr/managed-reference-acceptance.json
          retention-days: 30
