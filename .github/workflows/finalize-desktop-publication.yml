name: Finalize desktop source publication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-desktop-publication.yml'
      - 'scripts/finalize-desktop-source.py'
permissions:
  contents: write
  actions: write
concurrency:
  group: jailbreak-desktop-source-publication
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact uploaded source deltas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/finalize-desktop-source.py
      - name: Correct menu names and the main-frame test lookup
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          changes = {
            'packages/workbench/menus.js': (
              "b.disabled=!enabled(command);",
              "b.disabled=!enabled(command);b.setAttribute('aria-label',command.menuLabel??command.label.replace(/^[^:]+:\\s*/,''));"
            ),
            'tests/browser/test_desktop_commit.py': (
              "frame = next(f for f in self.page.frames if f.frame_element().get_attribute('id') == 'preview')",
              "frame = self.page.locator('#preview').element_handle().content_frame()"
            )
          }
          changed = []
          for name, (before, after) in changes.items():
            p=Path(name); text=p.read_text()
            if after in text: continue
            if text.count(before)!=1: raise RuntimeError('Unexpected source while correcting '+name)
            p.write_text(text.replace(before,after)); changed.append(name)
          if changed:
            subprocess.run(['git','add','--',*changed],check=True)
            subprocess.run(['git','commit','-m','fix(ide): name menu commands independently from shortcuts and resolve preview frame safely'],check=True)
          PY
      - name: Verify all compiler and runtime unit tests
        run: |
          mkdir -p test-results
          set -o pipefail
          npm test 2>&1 | tee test-results/desktop-unit.log
      - name: Build all examples and validate source modules
        run: |
          set -o pipefail
          npm run gate 2>&1 | tee test-results/desktop-gate.log
          npm run build 2>&1 | tee test-results/desktop-build.log
          npm run check 2>&1 | tee test-results/desktop-check.log
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Preserve independent CLR comparison gates
        run: |
          set -o pipefail
          node scripts/verify-msil-clr.mjs 2>&1 | tee test-results/desktop-clr.log
          node scripts/verify-exceptions-clr.mjs 2>&1 | tee test-results/desktop-exception-clr.log
      - name: Install browser verification tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Exercise real desktop designer debugger and restoration workflows
        run: |
          set -o pipefail
          python -m unittest discover -s tests/browser -p 'test_desktop_commit.py' -v 2>&1 | tee test-results/desktop-browser.log
      - name: Retain exact tested source and publication preimage
        if: always()
        run: |
          mkdir -p test-results/desktop-source
          git archive --format=tar.gz HEAD > test-results/desktop-source/source.tar.gz
          git rev-parse HEAD > test-results/desktop-source/commit.txt
          git rev-parse HEAD^{tree} > test-results/desktop-source/tree.txt
          git status --porcelain > test-results/desktop-source/worktree.txt
          git log -8 --oneline > test-results/desktop-source/history.txt
          sha256sum test-results/desktop-source/source.tar.gz > test-results/desktop-source/source.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-publication-evidence
          path: test-results
          retention-days: 14
      - name: Publish ordinary source commits without replacing concurrent work
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
      - name: Run the complete canonical browser and Pages gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run toolchain.yml --ref main
