name: Build managed binary fixtures
on:
  push:
    branches: [main]
    paths: ['tests/fixtures/msil-src/**', '.github/workflows/msil-fixtures.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build owned DLL and NuGet package
        run: |
          dotnet build tests/fixtures/msil-src/BinaryLibrary.csproj -c Release -o test-results/binary-fixtures/lib
          dotnet pack tests/fixtures/msil-src/BinaryLibrary.csproj -c Release -o test-results/binary-fixtures/packages
      - name: Record CLR oracle values
        shell: bash
        run: |
          mkdir -p test-results/oracle
          cat > test-results/oracle/oracle.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework></PropertyGroup><ItemGroup><Reference Include="Jailbreak.BinaryExamples"><HintPath>../binary-fixtures/lib/Jailbreak.BinaryExamples.dll</HintPath></Reference></ItemGroup></Project>
          EOF
          cat > test-results/oracle/Program.cs <<'EOF'
          using BinaryExamples;
          using System;
          using System.Text.Json;
          Console.WriteLine(JsonSerializer.Serialize(new { Add=Calculator.Add(40,2), Multiply=Calculator.Multiply(123456,654321), Sum=Calculator.SumTo(100), Factorial=Calculator.Factorial(6), Choice=Calculator.Choose(2), Sequence=Calculator.Sequence(5), Scale=Calculator.Scale(2.5,3), Greeting=Calculator.Greet("browser"), Counter=Calculator.UseCounter(10), State1=State.Next(), State2=State.Next(), Virtual=new NamedCounter(1).Describe() }));
          EOF
          dotnet run --project test-results/oracle/oracle.csproj -c Release > test-results/binary-fixtures/clr-oracle.json
      - name: Archive source for local reproducibility
        run: tar --exclude=.git --exclude=test-results -czf test-results/binary-fixtures/source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: managed-binary-fixtures
          path: test-results/binary-fixtures
