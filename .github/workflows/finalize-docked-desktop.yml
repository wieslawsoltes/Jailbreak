name: Finalize docked desktop and symbol restoration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.delivery/desktop-20260910*.json'
      - '.delivery/apply-desktop.py'
      - '.github/workflows/finalize-docked-desktop.yml'
permissions:
  contents: write
  actions: write
defaults:
  run:
    shell: bash
concurrency:
  group: jailbreak-docked-desktop-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize preimage-checked source as ordinary commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python .delivery/apply-desktop.py
      - name: Verify compiler runtime and authored source
        run: |
          mkdir -p test-results
          npm test 2>&1 | tee test-results/unit.log
          npm run gate 2>&1 | tee test-results/gate.log
          npm run build 2>&1 | tee test-results/build.log
          npm run check 2>&1 | tee test-results/check.log
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compare fresh DLLs and packages with independent CLR execution
        run: |
          node scripts/verify-msil-clr.mjs 2>&1 | tee test-results/clr.log
          node scripts/verify-exceptions-clr.mjs 2>&1 | tee test-results/exceptions-clr.log
      - name: Install real browser test tooling
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run all HTTP-served browser workflows
        run: python -m unittest discover -s tests/browser -p 'test_*.py' -v 2>&1 | tee test-results/browser.log
      - name: Preserve exactly the tested source
        if: always()
        run: |
          mkdir -p test-results/source
          git archive --format=tar.gz HEAD > test-results/source/source.tar.gz
          git rev-parse HEAD > test-results/source/commit.txt
          git status --short > test-results/source/worktree-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docked-desktop-verification
          path: test-results
      - uses: actions/upload-artifact@v4
        with:
          name: docked-desktop-site
          path: site
      - name: Publish verified commits without overwriting concurrent work
        run: git push origin HEAD:main
      - name: Run canonical Pages verification and deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run toolchain.yml --ref main
