name: Portable PDB fixture oracle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pdb-fixture.yml'
      - 'tests/fixtures/pdb-src/**'
      - 'scripts/build-pdb-fixture.mjs'
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: node scripts/build-pdb-fixture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jailbreak-pdb-fixture
          path: test-results/pdb-clr
