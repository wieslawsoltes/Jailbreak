name: Portable PDB fixture oracle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pdb-fixture.yml'
      - 'tests/fixtures/pdb-src/**'
      - 'scripts/build-pdb-fixture.mjs'
permissions:
  contents: write
concurrency:
  group: pdb-fixture
  cancel-in-progress: false
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: node scripts/build-pdb-fixture.mjs
      - name: Commit generated fixture and independently read CLR metadata
        run: |
          mkdir -p tests/fixtures/msil
          cp test-results/pdb-clr/fixture.json tests/fixtures/msil/pdb.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fixtures/msil/pdb.json
          if ! git diff --cached --quiet; then
            git commit -m 'test(pdb): retain SDK DLL symbols NuGet and independent CLR oracle'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jailbreak-pdb-fixture
          path: test-results/pdb-clr
