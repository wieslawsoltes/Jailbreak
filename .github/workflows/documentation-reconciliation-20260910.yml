name: Reconcile requirements documentation and verify main
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/audit/requirements-contract-20260910.json'
      - 'scripts/reconcile-documentation-20260910.py'
      - '.github/workflows/documentation-reconciliation-20260910.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: jailbreak-documentation-reconciliation
  cancel-in-progress: false
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      JAILBREAK_DOCS_CHECKS: ${{ runner.temp }}/documentation-evidence/checks.json
      JAILBREAK_DOCS_RECEIPT: ${{ runner.temp }}/documentation-evidence/reconciliation.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact input and validate documentation tooling
        id: input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/documentation-evidence"
          test -z "$(git status --porcelain)"
          python -m py_compile scripts/reconcile-documentation-20260910.py
          python -m json.tool docs/audit/requirements-contract-20260910.json > /dev/null
          git rev-parse HEAD > "$RUNNER_TEMP/documentation-evidence/audit-input.txt"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Run current compiler runtime example and build gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconcile-documentation-20260910.py --record-gate unit -- npm test
          python scripts/reconcile-documentation-20260910.py --record-gate examples -- npm run gate
          python scripts/reconcile-documentation-20260910.py --record-gate build -- npm run build
          python scripts/reconcile-documentation-20260910.py --record-gate syntax -- npm run check
      - name: Reconcile requirements current evidence guides historical milestones and backlog
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconcile-documentation-20260910.py --commit
          python scripts/reconcile-documentation-20260910.py --check | tee "$RUNNER_TEMP/documentation-evidence/documentation-check.json"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git log "${{ steps.input.outputs.sha }}..HEAD" --format='%H %s' > "$RUNNER_TEMP/documentation-evidence/documentation-commits.txt"
          git diff --stat "${{ steps.input.outputs.sha }}..HEAD" > "$RUNNER_TEMP/documentation-evidence/documentation-diff.txt"
          test -z "$(git status --porcelain)"
      - name: Build with updated documentation
        run: npm run build
      - name: Preserve reviewed documentation before publication
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/documentation-evidence/documentation.tar.gz" README.md docs scripts/reconcile-documentation-20260910.py .github/workflows/documentation-reconciliation-20260910.yml
          cp -R docs/audit "$RUNNER_TEMP/documentation-evidence/audit"
          git rev-parse HEAD > "$RUNNER_TEMP/documentation-evidence/tested-documentation-head.txt"
      - name: Publish focused documentation commits without overwriting concurrent source
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
          actual=$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq '.object.sha')
          test "$actual" = "${{ steps.reconcile.outputs.sha }}"
          printf '%s\n' "$actual" > "$RUNNER_TEMP/documentation-evidence/published-main.txt"
      - name: Dispatch and await complete browser CLR verification and Pages
        id: canonical
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ steps.reconcile.outputs.sha }}'
          gh workflow run toolchain.yml --ref main
          run_id=''
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --workflow toolchain.yml --commit "$expected" --event workflow_dispatch --limit 10 --json databaseId,headSha --jq '.[0].databaseId // empty')
            if test -n "$run_id"; then break; fi
            sleep 5
          done
          test -n "$run_id"
          printf '%s\n' "$run_id" > "$RUNNER_TEMP/documentation-evidence/canonical-run-id.txt"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --exit-status --interval 10
          gh api "repos/${{ github.repository }}/actions/runs/$run_id" > "$RUNNER_TEMP/documentation-evidence/canonical-run.json"
          gh api "repos/${{ github.repository }}/actions/runs/$run_id/jobs" > "$RUNNER_TEMP/documentation-evidence/canonical-jobs.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'documentation-evidence'
          run = json.loads((directory / 'canonical-run.json').read_text())
          jobs = json.loads((directory / 'canonical-jobs.json').read_text()).get('jobs', [])
          expected = (directory / 'tested-documentation-head.txt').read_text().strip()
          if run.get('head_sha') != expected or run.get('conclusion') != 'success':
              raise SystemExit('Canonical verification did not succeed for the exact documentation revision')
          result = json.loads((directory / 'reconciliation.json').read_text())
          receipt = {
              'format': 'jailbreak-documentation-publication-v1',
              'audited_input': result['baseline'],
              'published_head': expected,
              'commits': result.get('commits', []),
              'requirements': result['requirements'],
              'groups': result['groups'],
              'documents': result['documents'],
              'documentation_check': 'passed',
              'canonical_run': run['html_url'],
              'canonical_head': run['head_sha'],
              'ci_passed': True,
              'pages_deployed': any('deploy' in j.get('name', '').lower() and j.get('conclusion') == 'success' for j in jobs),
              'scope': 'Documentation reconciliation and exact existing implementation evidence; no new runtime compatibility completion is claimed.'
          }
          (directory / 'publication-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Preserve final or partial execution evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/documentation-evidence"
          git status --short > "$RUNNER_TEMP/documentation-evidence/final-worktree-status.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/documentation-evidence/final-local-head.txt"
          if test -f "$RUNNER_TEMP/documentation-evidence/canonical-run-id.txt"; then
            run_id=$(cat "$RUNNER_TEMP/documentation-evidence/canonical-run-id.txt")
            gh api "repos/${{ github.repository }}/actions/runs/$run_id" > "$RUNNER_TEMP/documentation-evidence/final-canonical-run.json" || true
            gh api "repos/${{ github.repository }}/actions/runs/$run_id/jobs" > "$RUNNER_TEMP/documentation-evidence/final-canonical-jobs.json" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-reconciliation-evidence
          path: ${{ runner.temp }}/documentation-evidence
          retention-days: 30
      - name: Publish documentation summary
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads((Path(os.environ['RUNNER_TEMP']) / 'documentation-evidence/publication-receipt.json').read_text())
          lines = ['# Documentation reconciliation complete', '',
                   f"Audited {receipt['documents']} Markdown documents and recorded {receipt['requirements']} stable requirements in {receipt['groups']} acceptance groups.", '',
                   f"Published head: `{receipt['published_head']}`.", '',
                   f"[Canonical verification]({receipt['canonical_run']}): passed for that exact revision.", '',
                   '| Commit | Documentation scope |', '| --- | --- |']
          for commit in receipt['commits']:
              lines.append(f"| `{commit['sha'][:12]}` | {commit['message']} |")
          lines += ['', 'Requirements/current evidence/architecture/APIs/IDE/verification/remaining-work guides are current to the audited source. Historical milestone details remain with explicit supersession notices. Full runtime/product acceptance is not claimed by a documentation update.']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n'.join(lines) + '\n')
          PY
