name: Verify workspace change library
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/workspace-changes/**
      - tests/workspace-changes.test.js
      - .github/workflows/verify-workspace-change-library.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: jailbreak-workspace-change-library
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correct the exact documentation-comment delimiter and check syntax
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file='packages/workspace-changes/index.js';
          const source=fs.readFileSync(file,'utf8');
          const bad='/** Wildcards *, ?, ** and **/; iterative matching avoids regex backtracking. */';
          const good='/** Glob wildcards use iterative matching rather than regex backtracking. */';
          if(source.includes(bad))fs.writeFileSync(file,source.replace(bad,good));
          JS
          node --check packages/workspace-changes/index.js
      - name: Validate pure transaction semantics
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {planWorkspaceReplace,applyWorkspaceChange,WorkspaceChangeHistory,matchesFilePattern} from './packages/workspace-changes/index.js';
          const files={'A.cs':'var a = 1;','Views/B.axaml':'<TextBlock Text="1"/>','library.binary.json':'1'};
          const plan=planWorkspaceReplace(files,{query:'1',replacement:'42'});
          assert.equal(plan.changes.length,2);
          const history=new WorkspaceChangeHistory();
          const next=history.apply(files,plan);
          assert.equal(files['A.cs'],'var a = 1;');
          assert.equal(next['A.cs'],'var a = 42;');
          assert.equal(next['library.binary.json'],'1');
          assert.deepEqual(history.undo(next),files);
          assert.deepEqual(history.redo(files),next);
          assert.throws(()=>applyWorkspaceChange({...files,'Views/B.axaml':'changed'},plan),/Source changed/);
          assert.equal(matchesFilePattern('A.cs','**/*.cs'),true);
          assert.equal(matchesFilePattern('Folder/A.cs','*.cs'),false);
          assert.equal(matchesFilePattern('Folder/A.cs','**/*.cs'),true);
          console.log('Workspace transaction smoke checks passed.');
          JS
      - name: Run the complete unit build and sample gates
        run: |
          npm test
          npm run gate
          npm run build
          npm run check
      - name: Publish the checked correction without forcing main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- packages/workspace-changes/index.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix(workspace): keep glob documentation inside a valid JavaScript comment'
            git push origin HEAD:main
          fi
      - name: Run canonical browser and deployment gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run toolchain.yml --ref main
