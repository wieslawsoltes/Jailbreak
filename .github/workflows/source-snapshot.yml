name: Reproducible source snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/source-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exactly the checked-out source
        run: |
          mkdir -p /tmp/jailbreak-source
          git archive --format=tar.gz HEAD > /tmp/jailbreak-source/source.tar.gz
          git rev-parse HEAD > /tmp/jailbreak-source/commit.txt
          sha256sum /tmp/jailbreak-source/source.tar.gz > /tmp/jailbreak-source/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: jailbreak-source-snapshot
          path: /tmp/jailbreak-source
