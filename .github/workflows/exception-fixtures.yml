name: Exception and checked arithmetic reference fixtures
on:
  push:
    branches: [main]
    paths: ['tests/fixtures/exception-src/**', '.github/workflows/exception-fixtures.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build owned managed test binaries
        run: |
          dotnet build tests/fixtures/exception-src/ExceptionLibrary.csproj -c Release -o /tmp/exception-fixtures/lib
          dotnet pack tests/fixtures/exception-src/ExceptionLibrary.csproj -c Release -o /tmp/exception-fixtures/packages
          git rev-parse HEAD > /tmp/exception-fixtures/commit.txt
          sha256sum /tmp/exception-fixtures/lib/*.dll /tmp/exception-fixtures/packages/*.nupkg > /tmp/exception-fixtures/hashes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: exception-fixtures
          path: /tmp/exception-fixtures
